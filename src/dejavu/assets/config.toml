# dejavu config
#
# Days before an entry is reported as stale, measured from when it was last *verified*
# (checked_at), not when it was last edited.
# Stale entries are never hidden from search results; they come back marked with ⚠.

[stale_days]
context = 7
plan = 14
decision = 30
feature = 7
convention = 30
note = 14

# ---------------------------------------------------------------------------
# Obsidian. Leave `vault` unset and none of this applies — dejavu works alone.
#
# `dejavu obsidian init <path-to-vault>` fills this in for you.
# The vault is where *user*-level knowledge lives: things that stay true in a
# different repository, and that you will read back yourself.

# [obsidian]
# vault = "~/Documents/MyVault"
#
# Folders that are indexed and written to. Anything not listed is invisible to
# dejavu, so a vault full of personal notes stays out of your work sessions.
# include = ["Knowledge", "UserInfo", "Research"]
#
# auto        detect iCloud / Dropbox / Google Drive / Obsidian Sync and, when
#             found, only ever create and append — a body rewritten here could
#             lose an edit made on another device
# full        allow rewriting note bodies (local, unsynced vaults)
# append-only force the safe behaviour regardless of where the vault lives
# write_mode = "auto"
#
# How much of an investigation to file under Research/
#   all       mirror every handoff note
#   findings  reusable discoveries only (default)
#   manual    only when you ask
# research = "findings"
#
# Whether to offer to promote project knowledge to the vault
#   ask | always | never
# promote = "ask"
#
# At the end of a session, ask Claude to file what it learned in the vault — without
# checking with you first, on the grounds that you prune the vault yourself and a note
# you delete costs less than a discovery you lose. Needs the Stop hook installed by
# `dejavu init --global`. Never fires when promote = "never".
#   on | off
# harvest = "on"
#
# Sessions with fewer transcript lines than this are too small to have produced
# anything, and are skipped silently.
# harvest_min_lines = 40
